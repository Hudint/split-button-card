title: Split Button Dev
views:
  - title: Masonry
    path: masonry
    cards:
      - type: button
        entity: light.bed_light
      - type: custom:split-button-card
        buttons:
          - entity: light.bed_light
          - entity: light.ceiling_lights
          - name: Szene
            icon: mdi:palette
      - type: custom:split-button-card
        columns: 2
        buttons:
          - entity: light.kitchen_lights
          - entity: light.office_rgbw_lights
          - entity: light.living_room_rgbww_lights
          - entity: switch.decorative_lights
      - type: custom:split-button-card
        divider: line
        buttons:
          - name: Hoch
            icon: mdi:arrow-up
          - name: Stop
            icon: mdi:stop
          - name: Runter
            icon: mdi:arrow-down
      - type: custom:split-button-card
        divider: gap
        columns: 3
        buttons:
          - { name: Eins, icon: mdi:numeric-1 }
          - { name: Zwei, icon: mdi:numeric-2 }
          - { name: Drei, icon: mdi:numeric-3 }
          - { name: Vier, icon: mdi:numeric-4 }
          - { name: Fünf, icon: mdi:numeric-5 }
      - type: custom:split-button-card
        divider: none
        buttons:
          - { name: A, icon: mdi:alpha-a }
          - { name: B, icon: mdi:alpha-b }
  - title: Features
    path: features
    type: sections
    sections:
      - type: grid
        cards:
          - type: button
            entity: light.ceiling_lights
          - type: custom:split-button-card
            buttons:
              - entity: light.ceiling_lights
              - entity: light.bed_light
              - entity: light.living_room_rgbww_lights
                name: Sofa
          - type: custom:split-button-card
            state_background: true
            buttons:
              - entity: light.ceiling_lights
              - entity: light.kitchen_lights
              - entity: switch.decorative_lights
                name: Deko
          - type: custom:split-button-card
            buttons:
              - entity: light.ceiling_lights
                state_color: false
              - entity: light.kitchen_lights
                color: purple
                state_background: true
                background_opacity: 0.35
              - name: Alarm
                icon: mdi:alarm-light
                color: red
                state_background: true
                tap_action: { action: toggle }
                double_tap_action: { action: toggle }
          - type: custom:split-button-card
            columns: 3
            buttons:
              - entity: light.ceiling_lights
                span: 2
              - entity: light.bed_light
                row_span: 2
              - entity: light.kitchen_lights
              - entity: switch.decorative_lights
                name: Deko
              - entity: switch.ac
                span: 3
          - type: custom:split-button-card
            columns: 2
            divider: gap
            state_background: true
            buttons:
              - entity: light.kitchen_lights
                show_state: true
              - entity: light.office_rgbw_lights
                show_state: true
              - entity: cover.kitchen_window
                show_state: true
                span: 2
  - title: Sections
    path: sections
    type: sections
    sections:
      - type: grid
        cards:
          - type: button
            entity: light.bed_light
          - type: button
            entity: light.ceiling_lights
          - type: custom:split-button-card
            buttons:
              - entity: light.bed_light
              - entity: light.ceiling_lights
          - type: custom:split-button-card
            buttons:
              - entity: light.bed_light
              - entity: light.ceiling_lights
              - name: Szene
                icon: mdi:palette
          - type: custom:split-button-card
            columns: 2
            buttons:
              - entity: light.kitchen_lights
              - entity: light.office_rgbw_lights
              - entity: light.living_room_rgbww_lights
              - entity: switch.decorative_lights
  - title: Menu
    path: menu
    type: sections
    sections:
      - type: grid
        cards:
          - type: custom:split-button-card
            buttons:
              - entity: vacuum.demo_vacuum_0_ground_floor
                name: Staubsauger
                icon: mdi:robot-vacuum
                show_state: true
                state_display: "[[[ return entity.state === 'cleaning' ? 'Läuft gerade' : 'Läuft um 10:00'; ]]]"
                buttons:
                  - name: Jetzt starten
                    icon: mdi:play
                    tap_action:
                      action: perform-action
                      perform_action: vacuum.start
                      target: { entity_id: vacuum.demo_vacuum_0_ground_floor }
                  - name: Heute auslassen
                    icon: mdi:calendar-remove
                    tap_action:
                      action: toggle
                      entity: switch.ac
                  - name: Raum
                    icon: mdi:floor-plan
                    buttons:
                      - name: Küche
                        icon: mdi:countertop
                      - name: Wohnzimmer
                        icon: mdi:sofa
                      - name: Bad
                        icon: mdi:shower
          - type: button
            entity: light.bed_light
          - type: custom:split-button-card
            menu_resize: true
            buttons:
              - entity: vacuum.demo_vacuum_1_first_floor
                name: Staubsauger OG
                icon: mdi:robot-vacuum
                show_state: true
                menu_columns: 2
                buttons:
                  - name: Start
                    icon: mdi:play
                  - name: Pause
                    icon: mdi:pause
                  - name: Dock
                    icon: mdi:home-import-outline
                  - name: Finden
                    icon: mdi:map-marker
          - type: button
            entity: light.ceiling_lights
          - type: button
            entity: light.kitchen_lights
  - title: Back
    path: back
    type: sections
    max_columns: 4
    sections:
      - type: grid
        cards:
          - type: heading
            heading: "menu_back: left"
          - type: custom:split-button-card
            menu_back: left
            menu_timeout: 0
            buttons:
